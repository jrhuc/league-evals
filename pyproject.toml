[project]
name = "league-evals"
version = "0.1.0"
description = "Inspect evaluations of frontier models playing VGC doubles through the AI Draft League harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["inspect-ai==0.3.276", "openai>=1.60", "anthropic>=0.40"]

[project.scripts]
league-positions = "league_evals.positions:main"
league-notes = "league_evals.notes:main"

[project.entry-points.inspect_ai]
league_evals = "league_evals"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/league_evals"]

[tool.hatch.build.targets.wheel.force-include]
"data/pools" = "league_evals/data/pools"
"data/positions" = "league_evals/data/positions"
"data/notes" = "league_evals/data/notes"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
